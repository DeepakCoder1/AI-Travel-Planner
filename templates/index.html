<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Travel Planner</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:linear-gradient(135deg,#4f46e5,#0ea5e9);

            min-height:100vh;

            padding:40px;

        }

        .container{

            max-width:1100px;

            margin:auto;

            background:white;

            border-radius:20px;

            padding:40px;

            box-shadow:0 20px 50px rgba(0,0,0,.2);

        }

        h1{

            text-align:center;

            color:#4f46e5;

            margin-bottom:10px;

            font-size:40px;

        }

        .subtitle{

            text-align:center;

            color:#777;

            margin-bottom:35px;

        }

        .grid{

            display:grid;

            grid-template-columns:repeat(2,1fr);

            gap:20px;

        }

        .input-box{

            display:flex;

            flex-direction:column;

        }

        label{

            margin-bottom:8px;

            font-weight:600;

            color:#333;

        }

        input,select{

            padding:14px;

            border-radius:10px;

            border:1px solid #ddd;

            font-size:15px;

            transition:.3s;

        }

        input:focus,
        select:focus{

            outline:none;

            border-color:#4f46e5;

            box-shadow:0 0 10px rgba(79,70,229,.2);

        }

        button{

            margin-top:30px;

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#4f46e5;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#4338ca;

            transform:translateY(-2px);

        }

        .result{

            margin-top:40px;

            background:#f8fafc;

            border-radius:15px;

            padding:30px;

            border:1px solid #e5e7eb;

            line-height:1.8;

            color:#333;

            overflow-wrap:break-word;

        }

        .result h2{

            color:#4f46e5;

            margin-top:20px;

            margin-bottom:15px;

        }

        .result h3{

            margin-top:15px;

            color:#111827;

        }

        .result p{

            margin-top:8px;

        }

        .result a{

            display:inline-block;

            margin-top:10px;

            text-decoration:none;

            background:#4f46e5;

            color:white;

            padding:10px 18px;

            border-radius:8px;

        }

        .result a:hover{

            background:#4338ca;

        }

        .loading{

            display:none;

            text-align:center;

            margin-top:25px;

        }

        .spinner{

            width:45px;

            height:45px;

            border:5px solid #ddd;

            border-top:5px solid #4f46e5;

            border-radius:50%;

            animation:spin 1s linear infinite;

            margin:auto;

        }

        @keyframes spin{

            100%{

                transform:rotate(360deg);

            }

        }
        .day-card{

            background:#ffffff;

            margin-top:25px;

            padding:25px;

            border-radius:15px;

            box-shadow:0 10px 25px rgba(0,0,0,.12);

            border-left:8px solid #4f46e5;

        }

        .day-card h2{

            color:#4f46e5;

            margin-bottom:20px;

        }

        .day-card h3{

            margin-top:15px;

            color:#222;

        }

        .day-card p{

            margin-top:8px;

            line-height:1.8;

        }

        @media(max-width:768px){

            .grid{

                grid-template-columns:1fr;

            }

            .container{

                padding:25px;

            }

            h1{

                font-size:30px;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>🌍 AI Travel Planner</h1>

    <p class="subtitle">
        Plan your dream vacation with AI
    </p>

    <form action="/plan" method="POST" onsubmit="showLoading()">

        <div class="grid">

            <div class="input-box">

                <label>Destination</label>

                <input
                    type="text"
                    name="destination"
                    placeholder="Dubai"
                    required>

            </div>

            <div class="input-box">

                <label>Days</label>

                <input
                    type="number"
                    name="days"
                    placeholder="5"
                    required>

            </div>

            <div class="input-box">

                <label>Budget</label>

                <input
                    type="text"
                    name="budget"
                    placeholder="₹100000"
                    required>

            </div>

            <div class="input-box">

                <label>Travel Style</label>

                <select name="travel_style">

                    <option>Luxury</option>
                    <option>Budget</option>
                    <option>Adventure</option>
                    <option>Family</option>
                    <option>Solo</option>
                    <option>Couple</option>

                </select>

            </div>

        </div>

        <button>

            ✈ Generate Travel Plan

        </button>

    </form>

    <div class="loading" id="loading">

        <div class="spinner"></div>

        <br>

        <h3>Generating your travel plan...</h3>

    </div>

    {% if result %}

    <div class="result">

        {{ result|safe }}

    </div>

    {% endif %}

</div>

<script>

function showLoading(){

    document.getElementById("loading").style.display="block";

}

</script>

</body>

</html>
