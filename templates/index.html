<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Travel Planner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 850px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .result {
            margin-top: 35px;
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.7;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🌍 AI Travel Planner Agent</h1>

        <form action="/plan" method="POST">

            <div class="grid">

                <div>
                    <label>Destination</label>
                    <input
                        type="text"
                        name="destination"
                        placeholder="e.g. Dubai"
                        required>
                </div>

                <div>
                    <label>Days</label>
                    <input
                        type="number"
                        name="days"
                        placeholder="5"
                        required>
                </div>

                <div>
                    <label>Budget</label>
                    <input
                        type="text"
                        name="budget"
                        placeholder="₹100000"
                        required>
                </div>

                <div>
                    <label>Travel Style</label>

                    <select name="travel_style">

                        <option>Luxury</option>
                        <option>Budget</option>
                        <option>Adventure</option>
                        <option>Solo</option>
                        <option>Family</option>
                        <option>Couple</option>

                    </select>

                </div>

            </div>

            <button type="submit">
                Generate Travel Plan
            </button>

        </form>

        {% if result %}

        <div class="result">

            {{ result }}

        </div>

        {% endif %}

    </div>

</body>

</html>
